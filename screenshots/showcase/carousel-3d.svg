<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06060f"/><stop offset="50%" stop-color="#0d1117"/><stop offset="100%" stop-color="#06060f"/></linearGradient>
    <linearGradient id="fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1a3e" stop-opacity="0.5"/><stop offset="100%" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
    <radialGradient id="sp" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5af19"/><stop offset="100%" stop-color="#f12711"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#11998e"/><stop offset="100%" stop-color="#38ef7d"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2193b0"/><stop offset="100%" stop-color="#6dd5ed"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c59b6d"/><stop offset="100%" stop-color="#f5af19"/></linearGradient>
    <filter id="ds"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="sg"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    /* Ellipse: cx=450, cy=295, rx=260, ry=40. 5 cards at 72deg intervals, 10 steps of 36deg each.
       x=450+260*sin(t), y=295+40*cos(t), scale=0.45+0.55*(1+cos(t))/2, opacity=0.08+0.92*(1+cos(t))/2 */
    @keyframes o1{
      0%  {transform:translate(450px,335px) scale(1);opacity:1}
      10% {transform:translate(603px,327px) scale(.945);opacity:.88}
      20% {transform:translate(697px,307px) scale(.81);opacity:.65}
      30% {transform:translate(697px,283px) scale(.63);opacity:.38}
      40% {transform:translate(603px,263px) scale(.50);opacity:.18}
      50% {transform:translate(450px,255px) scale(.45);opacity:.08}
      60% {transform:translate(297px,263px) scale(.50);opacity:.18}
      70% {transform:translate(203px,283px) scale(.63);opacity:.38}
      80% {transform:translate(203px,307px) scale(.81);opacity:.65}
      90% {transform:translate(297px,327px) scale(.945);opacity:.88}
      100%{transform:translate(450px,335px) scale(1);opacity:1}
    }
    @keyframes o2{
      0%  {transform:translate(697px,307px) scale(.81);opacity:.65}
      10% {transform:translate(697px,283px) scale(.63);opacity:.38}
      20% {transform:translate(603px,263px) scale(.50);opacity:.18}
      30% {transform:translate(450px,255px) scale(.45);opacity:.08}
      40% {transform:translate(297px,263px) scale(.50);opacity:.18}
      50% {transform:translate(203px,283px) scale(.63);opacity:.38}
      60% {transform:translate(203px,307px) scale(.81);opacity:.65}
      70% {transform:translate(297px,327px) scale(.945);opacity:.88}
      80% {transform:translate(450px,335px) scale(1);opacity:1}
      90% {transform:translate(603px,327px) scale(.945);opacity:.88}
      100%{transform:translate(697px,307px) scale(.81);opacity:.65}
    }
    @keyframes o3{
      0%  {transform:translate(603px,263px) scale(.50);opacity:.18}
      10% {transform:translate(450px,255px) scale(.45);opacity:.08}
      20% {transform:translate(297px,263px) scale(.50);opacity:.18}
      30% {transform:translate(203px,283px) scale(.63);opacity:.38}
      40% {transform:translate(203px,307px) scale(.81);opacity:.65}
      50% {transform:translate(297px,327px) scale(.945);opacity:.88}
      60% {transform:translate(450px,335px) scale(1);opacity:1}
      70% {transform:translate(603px,327px) scale(.945);opacity:.88}
      80% {transform:translate(697px,307px) scale(.81);opacity:.65}
      90% {transform:translate(697px,283px) scale(.63);opacity:.38}
      100%{transform:translate(603px,263px) scale(.50);opacity:.18}
    }
    @keyframes o4{
      0%  {transform:translate(297px,263px) scale(.50);opacity:.18}
      10% {transform:translate(203px,283px) scale(.63);opacity:.38}
      20% {transform:translate(203px,307px) scale(.81);opacity:.65}
      30% {transform:translate(297px,327px) scale(.945);opacity:.88}
      40% {transform:translate(450px,335px) scale(1);opacity:1}
      50% {transform:translate(603px,327px) scale(.945);opacity:.88}
      60% {transform:translate(697px,307px) scale(.81);opacity:.65}
      70% {transform:translate(697px,283px) scale(.63);opacity:.38}
      80% {transform:translate(603px,263px) scale(.50);opacity:.18}
      90% {transform:translate(450px,255px) scale(.45);opacity:.08}
      100%{transform:translate(297px,263px) scale(.50);opacity:.18}
    }
    @keyframes o5{
      0%  {transform:translate(203px,307px) scale(.81);opacity:.65}
      10% {transform:translate(297px,327px) scale(.945);opacity:.88}
      20% {transform:translate(450px,335px) scale(1);opacity:1}
      30% {transform:translate(603px,327px) scale(.945);opacity:.88}
      40% {transform:translate(697px,307px) scale(.81);opacity:.65}
      50% {transform:translate(697px,283px) scale(.63);opacity:.38}
      60% {transform:translate(603px,263px) scale(.50);opacity:.18}
      70% {transform:translate(450px,255px) scale(.45);opacity:.08}
      80% {transform:translate(297px,263px) scale(.50);opacity:.18}
      90% {transform:translate(203px,283px) scale(.63);opacity:.38}
      100%{transform:translate(203px,307px) scale(.81);opacity:.65}
    }
    @keyframes ft{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    @keyframes bl{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
    @keyframes pr{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-1200}}
    @keyframes gp{0%,100%{opacity:.15}50%{opacity:.35}}
    .c1{animation:o1 25s linear infinite}.c2{animation:o2 25s linear infinite}.c3{animation:o3 25s linear infinite}.c4{animation:o4 25s linear infinite}.c5{animation:o5 25s linear infinite}
    .tf{animation:ft 4s ease-in-out infinite}.st{animation:tw 3s ease-in-out infinite}.bt{animation:bl 3s linear infinite}.rg{animation:pr 25s linear infinite}.gp{animation:gp 4s ease-in-out infinite}
  </style>
  <rect width="900" height="500" fill="url(#bg)" rx="12"/>
