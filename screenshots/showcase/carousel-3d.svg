  <g class="c3" filter="url(#ds)"><g transform="translate(-60,-80)"><rect width="120" height="150" rx="8" fill="#111119" stroke="url(#g3)" stroke-width="1.5"/><rect width="120" height="3" rx="1.5" fill="url(#g3)"/><rect x="10" y="14" width="100" height="52" rx="5" fill="#18182a"/><text x="60" y="46" text-anchor="middle" font-size="26">🌏</text><text x="60" y="86" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#e6edf3" font-weight="600">KLS Connect</text><text x="60" y="99" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" fill="#8b949e">Alumni Network</text><g transform="translate(10,110)"><rect width="34" height="12" rx="3" fill="#fff" opacity=".06"/><text x="17" y="9" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="6.5" fill="#c9d1d9">Next.js</text><rect x="38" width="28" height="12" rx="3" fill="#000020" opacity=".4"/><text x="52" y="9" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="6.5" fill="#c9d1d9">Expo</text><rect x="70" width="38" height="12" rx="3" fill="#FFCA28" opacity=".12"/><text x="89" y="9" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="6.5" fill="#FFCA28">Firebase</text></g><circle cx="107" cy="11" r="2.5" fill="#3fb950"/></g></g>
  <!-- Card 4: WhaleFriend (starts at 216°, back-left) -->
